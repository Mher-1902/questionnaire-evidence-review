[project]
name = "questionnaire-evidence-review"
version = "0.1.0"
description = "Evidence-grounded questionnaire drafting, human review, and approved reuse"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.50,<2",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evidence_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
