[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
allowedHosts = ["localhost", "127.0.0.1"]
enableStaticServing = false
maxUploadSize = 1

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0f766e"
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#172033"
font = "sans serif"
