name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Locked install, tests, and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.24"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint and formatting
        run: |
          bash -n full_run.sh
          uv run ruff check .
          uv run ruff format --check .
      - name: Workflow tests
        run: uv run pytest --junitxml=reports/test-results.xml
      - name: Keyless real-response verification
        run: uv run python scripts/verify.py
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Install verified secret scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan Git history for secrets
        run: '"${{ runner.temp }}/gitleaks" git . --redact=100 --no-banner'
      - name: Save check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.sha }}
          path: reports/test-results.xml
          retention-days: 7

  launcher:
    name: Clean one-command bootstrap
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap Python and the full local pipeline
        env:
          MODEL_API_KEY: ""
          UV_MANAGED_PYTHON: "true"
        run: ./full_run.sh --bootstrap --check-only

  container:
    name: Container replay and durable state
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned image with a fake build-context credential
        env:
          BUILD_CANARY: FAKE-BUILD-CREDENTIAL-${{ github.sha }}
        run: |
          printf 'MODEL_API_KEY=%s\n' "$BUILD_CANARY" > .env
          docker build --tag review-demo:${{ github.sha }} .
          docker run --rm --entrypoint .venv/bin/python review-demo:${{ github.sha }} -c "from pathlib import Path; assert not Path('/app/.env').exists(); print('Build-context credential excluded')"
      - name: Verify replay without credentials inside image
        run: |
          mkdir -p reports
          docker run --rm --entrypoint .venv/bin/python review-demo:${{ github.sha }} scripts/verify.py > reports/container-replay.json
      - name: Check health and approval persistence across recreation
        run: |
          docker volume create review-state
          docker run --detach --name review-probe --publish 127.0.0.1:8501:8501 --mount source=review-state,target=/app/.runtime review-demo:${{ github.sha }}
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 3 http://127.0.0.1:8501/_stcore/health
          docker exec review-probe .venv/bin/python scripts/container_probe.py approve > reports/container-approval.json
          docker rm --force review-probe
          docker run --detach --name review-probe --publish 127.0.0.1:8501:8501 --mount source=review-state,target=/app/.runtime review-demo:${{ github.sha }}
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 3 http://127.0.0.1:8501/_stcore/health
          docker exec review-probe .venv/bin/python scripts/container_probe.py reuse > reports/container-reuse.json
          docker inspect --format '{{.Image}}' review-probe > reports/container-image.txt
      - name: Container logs and cleanup
        if: always()
        run: |
          mkdir -p reports
          docker logs review-probe > reports/container.log 2>&1 || true
          docker rm --force review-probe || true
          docker volume rm review-state || true
      - name: Save container verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-verification-${{ github.sha }}
          path: reports/
          retention-days: 7

  delivery:
    name: Deliver verified local demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, container, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.24"
          enable-cache: false
      - name: Reproduce and package from passing main
        run: |
          uv sync --locked
          uv run python scripts/verify.py
          uv run python scripts/package_demo.py
          mkdir -p "$RUNNER_TEMP/delivery-smoke"
          tar -xzf dist/review-demo-*.tar.gz -C "$RUNNER_TEMP/delivery-smoke"
          cd "$RUNNER_TEMP/delivery-smoke/review-demo"
          ./full_run.sh --check-only
      - name: Upload runnable source/container package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-demo-${{ github.sha }}
          path: dist/
          retention-days: 7
